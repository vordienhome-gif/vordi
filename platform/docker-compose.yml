# Geliştirme için PostgreSQL. Üretim kurulumu (sunucu, HTTPS, yedekleme) ayrı belgelenecek.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: vordi
      POSTGRES_PASSWORD: vordi
      POSTGRES_DB: vordi
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
volumes:
  pgdata:
